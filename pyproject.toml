[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "versionkit"
version = "0.1.0"
description = "Small semantic-version helpers for Python"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "meduuv"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
